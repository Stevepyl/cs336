[project]
dependencies = [
  "einops>=0.8.1", # tensor operations
  "einx>=0.3.0", # more general tensor operations
  "jaxtyping>=0.3.0", # type hints for pytorch/jax/numpy
  "numpy",
  "psutil>=6.1.1",
  "pytest>=8.3.4",
  "regex>=2025.7.33", # more powerful regex than the builtin `re` module
  "submitit>=1.5.2", # job submission for SLURM
  "tiktoken>=0.9.0",
  "torch~=2.9.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch~=2.6.0; sys_platform == 'darwin' and platform_machine == 'x86_64'", # Intel Macs
  "tqdm>=4.67.1",
  "wandb>=0.19.7",
  "ty>=0.0.10",
  "swanlab>=0.7.6",
  "hydra-core>=1.3.2",
  "pandas>=2.3.3",
]
description = "CS336 Assignment 1"
name = "cs336_basics"
readme = "README.md"
requires-python = ">=3.12"
version = "1.0.6"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.8.3,<0.9.0"]

[tool.uv.build-backend]
module-name = "cs336_basics"
module-root = ""

[tool.uv]
package = true
python-preference = "managed"

[tool.pytest.ini_options]
addopts = "-s"
log_cli = true
log_cli_level = "WARNING"

[tool.ruff]
line-length = 120

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["F722", "UP012", "UP015"]
select = ["COM812"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ty]

[tool.ty.rules]
invalid-argument-type = "ignore"

[tool.ty.src]
exclude = ["cs336_basics/generate.py"]